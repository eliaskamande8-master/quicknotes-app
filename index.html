<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts instantly.</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <div>
                    <label for="note-input">Note text:</label>
                    <input type="text" id="note-input" placeholder="Type your note here...">
                </div>
                <div>
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>
                <button type="submit">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <section>
            <h2>Your notes</h2>
            <div>
                <label for="search-input">Search notes:</label>
                <input type="text" id="search-input" placeholder="Search...">
            </div>
            <p id="note-count">You have no notes yet.</p>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App</p>
    </footer>
</body>
</html>
